name: Build native social-network portfolio demo

on:
  push:
    branches: ["portfolio-native-demo"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-native-demo-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Source/social-network/client/package-lock.json

      - name: Install dependencies
        working-directory: Source/social-network/client
        run: npm ci

      - name: Build native React demo
        working-directory: Source/social-network/client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-social-demo-dist
          path: Source/social-network/client/dist
